<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="lib/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="lib/iconos/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/estilos.css">
  <title>Escritorio | MiNegocio</title>
</head>
<body class="pagina-escritorio">
<div class="app-wrapper">

  <header class="app-header">
    <div class="container-fluid px-4 d-flex align-items-center justify-content-between">
      <a class="app-brand" href="escritorio.html">MiNegocio</a>

      <div class="d-flex align-items-center gap-4">
        <span class="status-online"><i class="bi bi-wifi" aria-hidden="true"></i> En línea</span>

        <div class="dropdown">
          <button class="btn user-menu-btn dropdown-toggle" type="button" id="menuUsuario"
                  data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person" aria-hidden="true"></i>
            <span>Administrador</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end user-dropdown" aria-labelledby="menuUsuario">
            <li><a class="dropdown-item item-cuenta" href="#">Mi cuenta</a></li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <a class="dropdown-item item-salir" href="login.html" id="btnCerrarSesion">
                <i class="bi bi-box-arrow-left" aria-hidden="true"></i> Cerrar sesión
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <main class="app-main">
    <div class="container">
      <h1 class="visually-hidden">Escritorio de módulos</h1>
      <nav aria-label="Módulos del sistema">
        <ul class="row row-cols-2 row-cols-md-4 g-4 justify-content-center list-unstyled modulos-grid">
        <li class="col">
          <a class="modulo" href="#">
            <span class="modulo-icono mod-usuarios"><i class="bi bi-people" aria-hidden="true"></i></span>
            <span class="modulo-nombre">Usuarios</span>
          </a>
        </li>
        <li class="col">
          <a class="modulo" href="#">
            <span class="modulo-icono mod-negocio"><i class="bi bi-shop" aria-hidden="true"></i></span>
            <span class="modulo-nombre">Mi negocio</span>
          </a>
        </li>
        <li class="col">
          <a class="modulo" href="#">
            <span class="modulo-icono mod-inventario"><i class="bi bi-box-seam" aria-hidden="true"></i></span>
            <span class="modulo-nombre">Inventario</span>
          </a>
        </li>
        <li class="col">
          <a class="modulo" href="#">
            <span class="modulo-icono mod-movimientos"><i class="bi bi-arrow-left-right" aria-hidden="true"></i></span>
            <span class="modulo-nombre">Movimientos</span>
          </a>
        </li>
        <li class="col">
          <a class="modulo" href="#">
            <span class="modulo-icono mod-reportes"><i class="bi bi-file-earmark-bar-graph" aria-hidden="true"></i></span>
            <span class="modulo-nombre">Reportes</span>
          </a>
        </li>
        <li class="col">
          <a class="modulo" href="#">
            <span class="modulo-icono mod-cartera"><i class="bi bi-calculator" aria-hidden="true"></i></span>
            <span class="modulo-nombre">Cartera</span>
          </a>
        </li>
        <li class="col">
          <a class="modulo" href="#">
            <span class="modulo-icono mod-ventas"><i class="bi bi-cart3" aria-hidden="true"></i></span>
            <span class="modulo-nombre">Ventas</span>
          </a>
        </li>
        </ul>
      </nav>
    </div>
  </main>

  <footer class="app-footer">&copy; 2026 Impulso360 &middot; Todos los derechos reservados</footer>
</div>

<script src="lib/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap primero, y después nuestro CSS para poder ajustarlo -->
    <link rel="stylesheet" href="lib/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/iconos/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/estilos.css" />
    <title>Inicio de sesión | MiNegocio</title>
  </head>
  <body class="pagina-login">
    <!-- Contenedor general: deja el pie de página al fondo -->
    <div class="app-wrapper">
      <!-- Barra superior con el nombre del sistema -->
      <header class="app-header">
        <div class="container-fluid px-4">
          <a class="app-brand" href="login.html">MiNegocio</a>
        </div>
      </header>

      <!-- Contenido principal: centra la tarjeta del login -->
      <main class="app-main d-flex align-items-start justify-content-center">
        <div class="login-card">
          <h1 class="login-title">Bienvenido a MiNegocio</h1>
          <p class="login-subtitle">Control comercial para su negocio
          </p>

<!-- Mensaje de error o éxito que aparece al enviar el formulario -->
          <div id="mensajeLogin" class="alert d-none" role="alert">
  <strong id="avisoTitulo"></strong>
  <div id="avisoTexto"></div>
</div>

          <!-- novalidate: la validación la hacemos con Bootstrap y JavaScript -->
          <form id="formLogin" novalidate>
            <!-- Campo usuario (mb-3 = margen abajo) -->
            <div class="mb-3">
              <label for="usuario" class="form-label">Usuario</label>
              <input
                type="text"
                class="form-control"
                id="usuario"
                placeholder="Ingrese su usuario"
                required
              />
              <!-- Mensaje que aparece si el campo está vacío -->
              <div class="invalid-feedback">Ingrese su usuario.</div>
            </div>

            <div class="mb-4">
              <label for="clave" class="form-label">Contraseña</label>
              <input
                type="password"
                class="form-control"
                id="clave"
                placeholder="••••••••"
                required
              />
              <div class="invalid-feedback">Ingrese su contraseña.</div>
            </div>

            <button type="submit" class="btn btn-primary w-100">
              Ingresar
            </button>
          </form>
        </div>
      </main>

      <footer class="app-footer">
        &copy; 2026 Impulso360 &middot; Todos los derechos reservados
      </footer>
    </div>

    <script src="lib/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
